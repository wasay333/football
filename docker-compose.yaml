services:

  postgres:
    image: postgres:16-alpine
    container_name: football_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-football}
    volumes:
      - football_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-football}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # In production the CI/CD pipeline pushes a pre-built image to ghcr.io.
    # Locally you can run `docker compose up --build` to build from source.
    image: ${APP_IMAGE:-football_app_local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    container_name: football_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-football}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      APP_URL: ${APP_URL}
      FEDEX_API_KEY: ${FEDEX_API_KEY}
      FEDEX_SECRET_KEY: ${FEDEX_SECRET_KEY}
      FEDEX_API_BASE_URL: ${FEDEX_API_BASE_URL}
      FEDEX_TRACK_API_KEY: ${FEDEX_TRACK_API_KEY}
      FEDEX_TRACK_SECRET_KEY: ${FEDEX_TRACK_SECRET_KEY}
      FEDEX_TRACK_API_BASE_URL: ${FEDEX_TRACK_API_BASE_URL}
      FEDEX_GRANT_TYPE: ${FEDEX_GRANT_TYPE}
      FEDEX_TRACK_GRANT_TYPE: ${FEDEX_TRACK_GRANT_TYPE}
      FEDEX_CHILD_KEY: ${FEDEX_CHILD_KEY}
      FEDEX_CHILD_SECRET: ${FEDEX_CHILD_SECRET}
      FEDEX_TRACK_CHILD_KEY: ${FEDEX_TRACK_CHILD_KEY}
      FEDEX_TRACK_CHILD_SECRET: ${FEDEX_TRACK_CHILD_SECRET}
      FEDEX_PICKUP_TYPE: ${FEDEX_PICKUP_TYPE}
      FEDEX_PACKAGING_TYPE: ${FEDEX_PACKAGING_TYPE}
      FEDEX_WEIGHT_UNITS: ${FEDEX_WEIGHT_UNITS}
      FEDEX_DIMENSIONS_UNITS: ${FEDEX_DIMENSIONS_UNITS}
      FEDEX_ITEM_WEIGHT: ${FEDEX_ITEM_WEIGHT}
      FEDEX_MIN_WEIGHT: ${FEDEX_MIN_WEIGHT}
      FEDEX_PACKAGE_LENGTH: ${FEDEX_PACKAGE_LENGTH}
      FEDEX_PACKAGE_WIDTH: ${FEDEX_PACKAGE_WIDTH}
      FEDEX_PACKAGE_HEIGHT: ${FEDEX_PACKAGE_HEIGHT}
      FEDEX_LABEL_IMAGE_TYPE: ${FEDEX_LABEL_IMAGE_TYPE}
      FEDEX_LABEL_STOCK_TYPE: ${FEDEX_LABEL_STOCK_TYPE}
      FEDEX_SHIPPER_COUNTRY_CODE: ${FEDEX_SHIPPER_COUNTRY_CODE}
      FEDEX_SHIPPER_ADDRESS_LINE_1: ${FEDEX_SHIPPER_ADDRESS_LINE_1}
      FEDEX_SHIPPER_CITY: ${FEDEX_SHIPPER_CITY}
      FEDEX_SHIPPER_POSTAL_CODE: ${FEDEX_SHIPPER_POSTAL_CODE}
      FEDEX_SHIPPER_NAME: ${FEDEX_SHIPPER_NAME}
      FEDEX_SHIPPER_PHONE: ${FEDEX_SHIPPER_PHONE}
      FEDEX_ACCOUNT_NUMBER: ${FEDEX_ACCOUNT_NUMBER}
      FEDEX_SHIPPER_STATE_OR_PROVINCE_CODE: ${FEDEX_SHIPPER_STATE_OR_PROVINCE_CODE}
    volumes:
      - uploads:/app/public/assets
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: football_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - uploads:/app/public/assets:ro
    networks:
      - internal

volumes:
  football_data:
  uploads:

networks:
  internal:
    driver: bridge
